<!--
  Social preview image for JornadaGo (Open Graph / Twitter Card).
  Dimensions: 1200x630 (standard for social cards).
  Format: SVG — works as og:image for most platforms.
  Note: some older clients may not render SVG; a PNG fallback
  can be generated from this file if needed.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 630"
  width="1200"
  height="630"
>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1f" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- subtle grid pattern -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path
      d="M 40 0 L 0 0 0 40"
      fill="none"
      stroke="#1e293b"
      stroke-width="0.5"
    />
  </pattern>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4" />

  <!-- accent bar -->
  <rect x="80" y="230" width="120" height="6" rx="3" fill="url(#accent)" />

  <!-- brand name -->
  <text
    x="80"
    y="310"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="72"
    font-weight="800"
    fill="#ffffff"
    letter-spacing="-1"
  >
    JornadaGo
  </text>

  <!-- tagline -->
  <text
    x="80"
    y="380"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="28"
    font-weight="400"
    fill="#94a3b8"
  >
    Control de jornada laboral con geolocalización
  </text>

  <!-- decorative circles -->
  <circle cx="1050" cy="160" r="180" fill="#38bdf8" opacity="0.06" />
  <circle cx="1100" cy="480" r="120" fill="#38bdf8" opacity="0.04" />
  <circle cx="950" cy="400" r="60" fill="#38bdf8" opacity="0.08" />
</svg>
