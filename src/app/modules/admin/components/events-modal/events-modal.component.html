<!-- Modal -->
<app-dialog [open]="isOpen()" (closeRequest)="closeRequest.emit()">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header bg-primary text-bg-primary">
        <h1 class="modal-title fs-5" id="eventsModalLabel">
          Eventos del dia - {{ day | date: 'mediumDate' }}
        </h1>
        <button type="button" class="btn-close" (click)="closeRequest.emit()" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        @for (event of events; let i = $index; track i) {
          <h3>{{ event.eventType.name }} - {{ event.title }}</h3>
          <p>{{ event.description }}</p>
        } @empty {
          <h3>No hay eventos</h3>
        }
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeRequest.emit()">
          Cerrar
        </button>
      </div>
    </div>
  </div>
</app-dialog>
