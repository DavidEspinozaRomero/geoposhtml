<!-- Modal -->
<app-dialog [open]="isOpen()" (closeRequest)="closeRequest.emit()">
  <div class="modal-dialog">
    <div class="modal-content overflow-hidden rounded-xl bg-white shadow-xl">
      <div
        class="modal-header flex items-center justify-between gap-3 bg-blue-600 px-5 py-4 text-white"
      >
        <h1 class="modal-title text-lg font-semibold" id="recordsModalLabel">Registros</h1>
        <button
          type="button"
          class="rounded-md p-1.5 text-white/80 transition-colors hover:bg-white/10 hover:text-white"
          (click)="closeRequest.emit()"
          aria-label="Close"
        >
          <svg lucideX class="h-4 w-4"></svg>
        </button>
      </div>
      <div class="modal-body px-5 py-4">
        <form [formGroup]="recordsForm">
          <!-- input date -->
          <div class="mb-4">
            <div>
              <label class="mb-1 block text-sm font-medium text-slate-600" for="dateInput">
                Fecha:
              </label>
              <input
                id="dateInput"
                class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
                type="date"
                formControlName="date"
              />
            </div>
          </div>

          <!-- select company -->
          <div class="mb-4">
            <label class="mb-1 block text-sm font-medium text-slate-600" for="companyIdSelect">
              Compañias:
            </label>
            <select
              id="companyIdSelect"
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
              aria-label="lista de companias"
              formControlName="companyId"
            >
              <option selected disabled value="">-- Seleccione compania --</option>
              @for (company of companies; let i_company = $index; track i_company) {
                <option selected [value]="company.id">{{ company.name }}</option>
              }
            </select>
          </div>
          <!-- select employee -->
          <div class="mb-4">
            <label class="mb-1 block text-sm font-medium text-slate-600" for="employeeIdSelect">
              Empleado:
            </label>
            <select
              id="employeeIdSelect"
              class="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm text-slate-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
              aria-label="lista de empleados"
              formControlName="employeeId"
            >
              <option selected disabled value="">-- Seleccione empleado --</option>
              @for (employee of employees; let i_employee = $index; track i_employee) {
                <option selected [value]="employee.id">
                  {{ employee.username }}-{{ employee.name }}
                </option>
              }
            </select>
          </div>
          <!-- TODO: agregar mensaje de se requiere al menos 1 de los 3 -->
          <!-- @if(utilsService.isValidControl(recordsForm, 'typeId')){
            <small class="mt-1 block text-xs text-red-600">
              El tipo es requerido
            </small>
            } -->
          <hr />
          <!-- input text incident Admin -->
          <div class="space-y-1.5">
            <label for="floatingTextarea" class="block text-sm font-medium text-slate-600"
              >Incidencia Administrador</label
            >
            <textarea
              class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 placeholder:text-slate-400 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
              placeholder="Agregar una incidencia"
              formControlName="incidentAdmin"
              id="floatingTextarea"
              [class.border-red-500]="utilsService.isValidControl(recordsForm, 'incidentAdmin')"
            ></textarea>
          </div>
          @if (utilsService.isValidControl(recordsForm, 'incidentAdmin')) {
            <small class="mt-1 block text-xs text-red-600">
              El incidente debe ser mayor de 3 caracteres
            </small>
          }
        </form>
      </div>
      <div class="modal-footer flex justify-end gap-2 border-t border-slate-200 px-5 py-3">
        <button
          type="button"
          class="rounded-lg border border-slate-300 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition-colors hover:bg-slate-50"
          (click)="closeRequest.emit()"
        >
          Cerrar
        </button>
        <button
          type="button"
          class="inline-flex items-center justify-center rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-blue-700"
          (click)="onSubmit()"
        >
          Guardar
        </button>
      </div>
    </div>
  </div>
</app-dialog>
