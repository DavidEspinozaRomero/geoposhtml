<div class="p-6">
  <h1 class="mb-4 text-2xl font-bold tracking-tight text-slate-900">Compañias</h1>

  <button type="button" appBtn (click)="company.set(undefined)">Agregar +</button>

  <section id="filters" class="mt-4" appFilterSection>
    <div class="max-w-md space-y-1.5">
      <label for="inputName" appFilterLabel>Nombre de la Sociedad</label>
      <input
        id="inputName"
        type="text"
        appInput
        placeholder="Nombre de la Sociedad"
        value=""
        #inputName
        (keyup)="(inputName)"
      />
    </div>
  </section>

  <section id="companys-info" class="my-4">
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
      @for (
        company of companies() | filterKeyValue: 'name' : inputName.value;
        let i_company = $index;
        track i_company
      ) {
        <div appCard>
          <div appCardHeader class="bg-blue-600 text-center text-white">
            <strong> {{ company.name }} </strong>
          </div>
          <div appCardBody>
            <h5 class="mb-2 font-semibold text-slate-900">
              {{ company.address }}
            </h5>
            <p class="flex gap-2 text-sm text-slate-600">
              <button
                type="button"
                appBtn
                variant="secondary"
                size="sm"
                (click)="editCompany(company)"
              >
                <svg lucidePencil class="h-4 w-4"></svg>
              </button>
              <button
                type="button"
                appBtn
                variant="danger"
                size="sm"
                (click)="removeCompany(company, i_company)"
              >
                <svg lucideTrash2 class="h-4 w-4"></svg>
              </button>
            </p>
          </div>
          <ul class="divide-y divide-slate-100 border-t border-slate-200">
            <li class="px-4 py-2 text-sm text-slate-600">
              <small> {{ company.cif }} </small>
            </li>
            <li class="px-4 py-2 text-sm text-slate-600">
              <small> {{ company.account }} </small>
            </li>
          </ul>
        </div>
      }
    </div>
  </section>
</div>

<app-company-modal
  [company]="company()"
  (saveForm)="updateCompany($event)"
  (closeRequest)="company.set(undefined)"
></app-company-modal>
