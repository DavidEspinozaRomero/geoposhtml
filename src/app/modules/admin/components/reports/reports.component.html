<div class="p-6">
  <h1 class="mb-4 text-2xl font-bold tracking-tight text-slate-900">Reporte mensual</h1>

  <div class="mt-4 overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm">
    <div class="p-4">
      <div class="grid grid-cols-1 items-end gap-4 md:grid-cols-2">
        <div>
          <label for="reportMonth" class="mb-1 block text-sm font-medium text-slate-600">Mes</label>
          <input
            id="reportMonth"
            type="month"
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm text-slate-900 focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-500/30"
            [ngModel]="month()"
            (ngModelChange)="onMonthChange($event)"
          />
          <div class="mt-1.5 block text-xs text-slate-500">
            El reporte descarga un archivo XLSX con el resumen del mes seleccionado.
          </div>
        </div>
        <div>
          <button
            type="button"
            class="inline-flex items-center justify-center gap-2 rounded-lg bg-blue-600 px-4 py-2 text-sm font-semibold text-white transition-colors hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
            [disabled]="downloading() || !month()"
            (click)="downloadXlsx()"
          >
            @if (downloading()) {
              <span
                class="h-4 w-4 animate-spin rounded-full border-2 border-current border-t-transparent"
                aria-hidden="true"
              ></span>
              <span role="status">Descargando...</span>
            } @else {
              <svg lucideFileDown class="h-4 w-4" aria-hidden="true"></svg>
              Descargar XLSX
            }
          </button>
        </div>
      </div>

      @if (message()) {
        <div
          class="mt-4 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700"
          role="alert"
        >
          {{ message() }}
        </div>
      }
    </div>
  </div>
</div>
