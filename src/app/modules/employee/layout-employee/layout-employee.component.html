<nav class="sidebar" aria-label="sidebar" [ngClass]="{ menu_extend: !colapse }">
  <p
    class="my-3 ps-3 text-white"
    role="button"
    aria-label="brand and sidebar toggle btn"
    style="inline-size: max-content"
    tabindex="0"
    (click)="colapse = !colapse"
    (keydown.enter)="colapse = !colapse"
    (keydown.space)="colapse = !colapse"
  >
    <svg lucideApple class="h-5 w-5"></svg> <span class="ms-3">BRAND</span>
  </p>
  <ul class="nav d-block h-100">
    @for (item of menu; let i_item = $index; track i_item) {
      <li class="nav-item" role="button" [routerLink]="item.route" [routerLinkActive]="'hovered'">
        <a class="nav-link">
          <svg [lucideIcon]="item.icon" class="h-5 w-5"></svg>
          <span class="ms-3"> {{ item.label | titlecase }} </span>
        </a>
      </li>
    }

    <li class="nav-item mt-auto">
      <a
        class="nav-link"
        tabindex="0"
        (click)="logout()"
        (keydown.enter)="logout()"
        (keydown.space)="logout()"
      >
        <svg lucideLogOut class="h-5 w-5"></svg>
        <span class="ms-3">Log out</span>
      </a>
    </li>
  </ul>
</nav>

<main class="main p-3 vh-100" [ngClass]="{ menu_colapse: !colapse }">
  <router-outlet></router-outlet>
</main>
